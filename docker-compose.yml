services:
  app:
    build: .
    ports:
      - "3210:3210"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AHUMANE_PREFER_LOCAL: "1"
      AHUMANE_DISABLE_CLOUD: "1"
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
